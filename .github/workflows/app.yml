name: Application verification
on:
  push:
    branches: [main, 'refine/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - name: Verify runtime preparation safeguards
        run: python3 tool/test_fetch_runtimes.py
      - name: Prepare pinned offline runtimes
        run: bash tool/fetch_runtimes.sh
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: npm --prefix tool ci
      - run: npx playwright install --with-deps chromium
        working-directory: tool
      - name: Exercise the real offline runtimes
        run: npm --prefix tool test
      - run: flutter build apk --debug
      - name: Compile unsigned release configuration
        run: flutter build apk --release
      # APK uploads remain paused until corresponding-source delivery is verified;
      # see THIRD_PARTY.md. The APK build and every validation step still run.
      - name: Retain runtime verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-verification
          path: |
            tool/test-results/*.png
            tool/test-results/*-plot.json
            tool/runtimes.prepared.json

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify and prepare pinned offline runtimes
        run: |
          python3 tool/test_fetch_runtimes.py
          bash tool/fetch_runtimes.sh
      - run: flutter pub get --enforce-lockfile
      - name: Compile unsigned iOS simulator application
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Compile unsigned iOS device Release application
        run: flutter build ios --release --no-codesign --no-pub
      # Runtime source-delivery gates also apply to Apple binaries; no app upload.
